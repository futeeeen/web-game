<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6f73" />
    <meta
      name="description"
      content="所有方塊會同時滑動的邏輯解謎遊戲，利用牆壁與障礙物重新排列隊形。"
    />
    <title>同步方塊 | Web Game Collection</title>
    <link rel="stylesheet" href="./sync-blocks.css?v=4" />
  </head>
  <body>
    <main class="app" aria-label="同步方塊遊戲">
      <header class="topbar">
        <a class="home-link" href="../../" aria-label="回到遊戲列表">回到列表</a>
        <div class="title-block">
          <p class="eyebrow">Synchronized Sliding Puzzle</p>
          <h1>同步方塊</h1>
        </div>
        <div class="stats" aria-live="polite">
          <span><strong id="levelText">1</strong> 關卡</span>
          <span><strong id="moveText">0</strong> 步</span>
          <span><strong id="bestText">--</strong> 最佳</span>
        </div>
      </header>

      <section class="play-area">
        <div class="board-wrap">
          <div id="board" class="board" tabindex="0" aria-label="同步方塊棋盤"></div>
        </div>

        <aside class="control-panel">
          <section class="panel-section">
            <h2 id="levelName">教學 1</h2>
            <p id="levelNote">按一個方向，感受所有方塊一起滑到底。</p>
          </section>

          <section class="panel-section">
            <div class="meter-row">
              <span>最短解</span>
              <strong id="parText">--</strong>
            </div>
            <p id="statusText" class="status">使用 WASD、方向鍵，或滑動棋盤。</p>
          </section>

          <section class="panel-section">
            <div class="pager" aria-label="關卡分頁">
              <button type="button" id="prevPageBtn" aria-label="上一頁">‹</button>
              <strong id="pageText">第 1 頁</strong>
              <button type="button" id="nextPageBtn" aria-label="下一頁">›</button>
            </div>
            <div id="levelPicker" class="level-picker" aria-label="選擇關卡"></div>
          </section>

          <section class="panel-section controls">
            <div class="dpad" aria-label="方向控制">
              <button type="button" class="dir-btn up" data-dir="up" aria-label="向上">↑</button>
              <button type="button" class="dir-btn left" data-dir="left" aria-label="向左">←</button>
              <button type="button" class="dir-btn right" data-dir="right" aria-label="向右">→</button>
              <button type="button" class="dir-btn down" data-dir="down" aria-label="向下">↓</button>
            </div>
            <div class="actions">
              <button type="button" id="undoBtn">復原</button>
              <button type="button" id="resetBtn">重來</button>
              <button type="button" id="hintBtn">提示</button>
              <button type="button" id="nextBtn">下一關</button>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script src="./sync-blocks.js?v=4"></script>
  </body>
</html>
