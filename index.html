<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2c45f" />
    <meta name="description" content="部署在 GitHub Pages 的網頁小遊戲合集。" />
    <title>Web Game Collection</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="library">
      <header class="intro">
        <p class="eyebrow">Web Game Collection</p>
        <h1>網頁小遊戲合集</h1>
        <p>收集適合用瀏覽器直接遊玩的輕量小遊戲，支援桌機與手機操作。</p>
      </header>

      <section class="game-list" aria-label="遊戲列表">
        <a class="game-card sprout" href="./games/star-sprout/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>星星發芽</strong>
            <span>收集星光、照顧小芽，在限時內讓它長大。</span>
          </span>
          <span class="card-action">開始</span>
        </a>

        <a class="game-card rect" href="./games/rect-clues/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>矩形線索</strong>
            <span>在 8x8 棋盤中依照數字線索推理出正確區塊。</span>
          </span>
          <span class="card-action">開始</span>
        </a>

        <a class="game-card draw" href="./games/draw-guess/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>你畫我猜</strong>
            <span>隨機出題、自訂限時作畫，時間到後交給另一位玩家猜答案。</span>
          </span>
          <span class="card-action">開始</span>
        </a>

        <a class="game-card slide" href="./games/color-slide/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>同色滑塊</strong>
            <span>用方向鍵讓彩色磚塊同步滑動，完整停進相同顏色的目標區。</span>
          </span>
          <span class="card-action">開始</span>
        </a>

        <a class="game-card sync" href="./games/sync-blocks/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>同步方塊</strong>
            <span>所有長條、L 形與小方塊會同時滑動，靠撞牆重塑陣型。</span>
          </span>
          <span class="card-action">開始</span>
        </a>
      </section>
    </main>
  </body>
</html>
