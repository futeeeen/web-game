<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2c45f" />
    <meta name="description" content="可直接在 GitHub Pages 遊玩的網頁小遊戲目錄。" />
    <title>Web Game Collection</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="library">
      <header class="intro">
        <p class="eyebrow">Web Game Collection</p>
        <h1>小遊戲目錄</h1>
        <p>挑一款直接開始玩。每個遊戲都是純靜態網頁，適合放在 GitHub Pages。</p>
      </header>

      <section class="game-list" aria-label="遊戲列表">
        <a class="game-card sprout" href="./games/star-sprout/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>星芽採集日</strong>
            <span>插畫風接物遊戲，手機拖曳或桌機鍵盤都能玩。</span>
          </span>
          <span class="card-action">開始</span>
        </a>

        <a class="game-card rect" href="./games/rect-clues/">
          <span class="card-art" aria-hidden="true"></span>
          <span class="card-copy">
            <strong>矩形線索盤</strong>
            <span>8x8 幾何推理題，用數字面積線索框出一個完整布局。</span>
          </span>
          <span class="card-action">開始</span>
        </a>
      </section>
    </main>
  </body>
</html>
